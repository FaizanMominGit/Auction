name: Close Expired Auctions

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes

jobs:
  close_auctions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin pytz

      - name: Run the script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./auction-d7ab9-firebase-adminsdk-fbsvc-0667fe910d.json
        run: python close_auctions.py
