plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.auction'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.auction"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Firebase BOM for managing Firebase dependencies
    implementation platform('com.google.firebase:firebase-bom:33.7.0')

    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.27'

    // Firebase dependencies
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-functions:20.1.1'
    implementation 'com.firebaseui:firebase-ui-auth:8.0.2'
    implementation 'com.google.firebase:firebase-analytics:21.0.0'
    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    implementation libs.firebase.storage
    annotationProcessor 'com.github.bumptech.glide:compiler:4.1.1'

    // AndroidX dependencies
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.testng:testng:7.7.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}